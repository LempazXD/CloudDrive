services:
    clouddrive.api:
        image: ${DOCKER_REGISTRY-}clouddriveapi
        container_name: clouddrive.api
        build:
            context: .
            dockerfile: src/Bootstrapper/CloudDrive.Api/Dockerfile
        ports:
            - "8080:8080"
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ConnectionStrings__CloudDrive=${ConnectionStrings__CloudDrive}
            - Jwt__SigningKey=${Jwt__SigningKey}
            - Seq__ServerUrl=http://clouddrive.seq:80
            - ObjectStorage__Endpoint=http://clouddrive.storage:8333
            - ObjectStorage__PublicEndpoint=http://localhost:8333
            - ObjectStorage__AccessKey=${ObjectStorage__AccessKey}
            - ObjectStorage__SecretKey=${ObjectStorage__SecretKey}
            - ObjectStorage__Bucket=${ObjectStorage__Bucket}
            - Smtp__Host=clouddrive.mail
            - Smtp__Port=1025
            - Smtp__FromAddress=noreply@clouddrive.local
            - Smtp__FromName=CloudDrive
        depends_on:
            clouddrive.database:
                condition: service_healthy
            clouddrive.seq:
                condition: service_started
            clouddrive.storage:
                condition: service_healthy
            clouddrive.mail:
                condition: service_started
        restart: unless-stopped

    clouddrive.database:
        image: postgres:17
        container_name: clouddrive.database
        environment:
            - POSTGRES_DB=${DB_DATABASE}
            - POSTGRES_USER=${DB_USER}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
        ports:
            - "5433:5432"
        volumes:
            - ./.containers/database:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    clouddrive.seq:
        image: datalust/seq:latest
        container_name: clouddrive.seq
        environment:
            - ACCEPT_EULA=Y
            - SEQ_FIRSTRUN_NOAUTHENTICATION=True
        ports:
            - "5341:80"
        volumes:
            - ./.containers/seq:/data
        restart: unless-stopped

    clouddrive.storage:
        image: chrislusf/seaweedfs
        container_name: clouddrive.storage
        environment:
            - AWS_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY}
            - AWS_SECRET_ACCESS_KEY=${STORAGE_SECRET_KEY}
            - S3_BUCKET=${STORAGE_BUCKET}
        ports:
            - "8333:8333"
            - "9333:9333"
        volumes:
            - ./.containers/storage:/data
        healthcheck:
            test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9333/cluster/status" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped

    clouddrive.mail:
        image: axllent/mailpit
        container_name: clouddrive.mail
        ports:
            - "8025:8025"
            - "1025:1025"
        restart: unless-stopped
